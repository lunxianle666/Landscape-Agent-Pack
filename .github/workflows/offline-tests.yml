name: Offline tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: "python -m pip install --only-binary=:all: -r requirements-v02-dev.txt"
      - run: python -m pip check
      - run: python -m compileall -q landscape_agent_pack guards installer examples tests
      - run: python -m unittest discover -s tests/unit -v
      - run: python -m unittest discover -s tests/smoke -v
      - run: python installer/verify-rules.py --root .
      - run: python -m examples.geometry_qa
